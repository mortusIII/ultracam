<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>UltraCam</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--fg:#f2f2f2;--ac:#4ade80;--pn:#1c1c22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative}
#view{width:100%;height:100%;object-fit:contain;display:block}
#info{position:absolute;top:8px;left:8px;background:#000a;padding:4px 8px;border-radius:6px;font-size:12px}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#bar{display:flex;align-items:center;justify-content:space-around;padding:10px;background:var(--bg)}
button{background:var(--pn);color:var(--fg);border:1px solid #333;border-radius:10px;padding:10px 14px;font-size:14px}
#shot{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid #888}
#thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--pn);border:1px solid #333}
#modal{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box;gap:10px}
#prev{flex:1;min-height:0;width:100%;object-fit:contain}
#modal .row{display:flex;gap:10px;justify-content:center;align-items:center}
#meta{text-align:center;font-size:12px;opacity:.8}
.pri{background:var(--ac);color:#000;border:0;font-weight:600}
</style></head><body>
<div id="app">
 <div id="stage"><canvas id="view"></canvas><div id="info">Iniciando…</div><div id="msg"></div></div>
 <div id="bar"><img id="thumb" alt=""><button id="shot" aria-label="Tomar foto"></button><button id="flip">Girar cámara</button></div>
</div>
<div id="modal">
 <img id="prev" alt="Vista previa">
 <div id="meta"></div>
 <div class="row"><button id="discard">Descartar</button><button id="save" class="pri">Guardar en galería</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const VS='attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;varying vec2 uv;uniform sampler2D t;uniform vec2 px;uniform float sh,ct,br,ga,sa;
void main(){vec3 c=texture2D(t,uv).rgb;
vec3 b=(texture2D(t,uv+vec2(px.x,0.)).rgb+texture2D(t,uv-vec2(px.x,0.)).rgb+texture2D(t,uv+vec2(0.,px.y)).rgb+texture2D(t,uv-vec2(0.,px.y)).rgb)*.25;
c+=(c-b)*sh;c=pow(max(c,0.),vec3(1./ga));c=(c-.5)*ct+.5+br;
float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,sa);gl_FragColor=vec4(clamp(c,0.,1.),1.);}`;

class GP{ // procesador de imagen en GPU (WebGL)
 constructor(cv){this.cv=cv;const g=this.g=cv.getContext('webgl',{preserveDrawingBuffer:true});
  const mk=(ty,s)=>{const o=g.createShader(ty);g.shaderSource(o,s);g.compileShader(o);return o};
  const pr=this.pr=g.createProgram();g.attachShader(pr,mk(g.VERTEX_SHADER,VS));g.attachShader(pr,mk(g.FRAGMENT_SHADER,FS));g.linkProgram(pr);g.useProgram(pr);
  g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
  const a=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);
  g.bindTexture(g.TEXTURE_2D,g.createTexture());
  [[g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE],[g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE],[g.TEXTURE_MIN_FILTER,g.LINEAR],[g.TEXTURE_MAG_FILTER,g.LINEAR]].forEach(([k,v])=>g.texParameteri(g.TEXTURE_2D,k,v));
  g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,true);this.max=g.getParameter(g.MAX_TEXTURE_SIZE);}
 draw(src,w,h,P){const g=this.g,cv=this.cv;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  g.viewport(0,0,w,h);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,src);
  const u=n=>g.getUniformLocation(this.pr,n);g.uniform2f(u('px'),1/w,1/h);
  for(const k of['sh','ct','br','ga','sa'])g.uniform1f(u(k),P[k]);g.drawArrays(g.TRIANGLE_STRIP,0,4);}
}

const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const view=$('view'),main=new GP(view),photo=new GP(document.createElement('canvas'));
const probe=document.createElement('canvas');probe.width=probe.height=24;const pc=probe.getContext('2d',{willReadFrequently:true});
let stream,track,ic,face='environment',n=0,autoGa=1,blob=null,url=null;

// Estado automático: todo se calcula solo a partir de la escena
const A={sh:1,ct:1.1,br:0,sa:1.1,ga:1};
const params=()=>A;
const cl=(v,a,b)=>Math.min(b,Math.max(a,v)),ease=(k,t,f)=>A[k]+=(t-A[k])*f;

function analyze(){
 pc.drawImage(vid,0,0,48,48);const d=pc.getImageData(0,0,48,48).data,N=2304;
 let s=0,s2=0,sat=0;
 for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b,mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  s+=l;s2+=l*l;sat+=mx?(mx-mn)/mx:0;}
 const m=cl(s/N,.03,.9),sd=Math.sqrt(Math.max(1e-4,s2/N-(s/N)**2)),sa=sat/N;
 ease('ga',cl(Math.log(m)/Math.log(.45),.7,2.2),.12);   // iluminación: lleva el brillo medio a un nivel agradable
 ease('ct',cl(.22/sd,.95,1.5),.1);                      // contraste: sube si la escena es plana
 ease('sa',sa<.25?1.35:sa<.4?1.2:1.05,.08);             // color: realza escenas apagadas
 ease('sh',m<.18?.6:1.1,.1);                            // nitidez: menos en poca luz para no amplificar ruido
}

function loop(){
 if(vid.readyState>=2&&vid.videoWidth){
  if(n++%6===0)analyze();
  main.draw(vid,vid.videoWidth,vid.videoHeight,A);
 }
 requestAnimationFrame(loop);
}

async function start(){
 try{
  stream&&stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:face},width:{ideal:4096},height:{ideal:2160},frameRate:{ideal:30}}});
  vid.srcObject=stream;await vid.play();track=stream.getVideoTracks()[0];
  ic=window.ImageCapture?new ImageCapture(track):null;
  track.applyConstraints({advanced:[{focusMode:'continuous'},{exposureMode:'continuous'},{whiteBalanceMode:'continuous'}]}).catch(()=>{});
  const s=track.getSettings();$('info').textContent=`Vista: ${s.width}×${s.height} · ${Math.round(s.frameRate||0)} fps · Modo automático`;
  $('msg').style.display='none';
 }catch(e){const m=$('msg');m.style.display='flex';
  m.textContent='No se pudo abrir la cámara ('+e.name+'). Concede el permiso y abre esta página desde HTTPS o localhost.';
  $('info').textContent='Sin cámara';}
}

async function snap(){
 const P={...A};let w,h,done=false;
 if(ic){ // foto a resolución máxima del sensor (Chrome/Android)
  try{const c=await ic.getPhotoCapabilities(),o={};
   if(c.imageWidth&&c.imageHeight){o.imageWidth=c.imageWidth.max;o.imageHeight=c.imageHeight.max}
   const bm=await createImageBitmap(await ic.takePhoto(o));
   if(bm.width<=photo.max&&bm.height<=photo.max){w=bm.width;h=bm.height;photo.draw(bm,w,h,P);done=true}
  }catch(e){}
 }
 if(!done){w=vid.videoWidth;h=vid.videoHeight;photo.draw(vid,w,h,P)}
 blob=await new Promise(r=>photo.cv.toBlob(r,'image/jpeg',.95));
 if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);
 $('prev').src=url;$('meta').textContent=`${w}×${h} px · ${(w*h/1e6).toFixed(1)} MP · ${(blob.size/1048576).toFixed(1)} MB`;
 $('modal').style.display='flex';
}

async function save(){
 const f=new File([blob],'UltraCam_'+Date.now()+'.jpg',{type:'image/jpeg'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]}); // móvil: "Guardar imagen" → galería
  else{const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();}
  $('thumb').src=url;
 }catch(e){if(e.name!=='AbortError')alert('No se pudo guardar: '+e.message)}
 $('modal').style.display='none';
}

$('shot').onclick=snap;
$('discard').onclick=()=>{$('modal').style.display='none'};
$('save').onclick=save;
$('flip').onclick=()=>{face=face==='environment'?'user':'environment';start()};
start();loop();
</script></body></html>
