<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>UltraCam</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--fg:#f2f2f2;--ac:#4ade80;--pn:#1c1c22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative}
#view{width:100%;height:100%;object-fit:cover;display:block}
#info{position:absolute;top:8px;left:8px;background:#000a;padding:4px 8px;border-radius:6px;font-size:12px}
#tm{position:absolute;top:8px;right:8px;background:#d22;padding:4px 8px;border-radius:6px;font-size:12px;display:none}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#modes{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:8px 8px 0;background:var(--bg)}
#modes button{padding:6px 12px;border-radius:20px;font-size:13px}#modes label{font-size:12px}
#modes .on{background:var(--ac);color:#000;border:0;font-weight:600}
#bar{display:flex;align-items:center;justify-content:space-around;padding:10px;background:var(--bg)}
button{background:var(--pn);color:var(--fg);border:1px solid #333;border-radius:10px;padding:10px 14px;font-size:14px}
#shot{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid #888;padding:0;transition:border-radius .15s}
#shot.vid{background:#e33}
#shot.rec{border-radius:16px}
#thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--pn);border:1px solid #333}
#modal{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box;gap:10px}
#prev,#pv{flex:1;min-height:0;width:100%;object-fit:contain}
#modal .row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#meta{text-align:center;font-size:12px;opacity:.8}
#toast{text-align:center;font-size:13px;color:var(--ac);min-height:16px}
#cmp{position:relative;flex:1;min-height:0}#cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#bf{clip-path:inset(0 50% 0 0)}#cs{position:absolute;bottom:4px;left:5%;width:90%}#ctl{font-size:12px}#ctl input{width:90px;vertical-align:middle}#ctl select,#ctl button{padding:6px 8px}
.pri{background:var(--ac);color:#000;border:0;font-weight:600}
</style></head><body>
<div id="app">
 <div id="stage"><canvas id="view"></canvas><div id="info">Iniciando…</div><div id="tm">● 00:00</div><div id="msg"></div></div>
 <div id="modes"><button id="mPhoto" class="on">Foto</button><button id="mVideo">Video</button><button id="nightBtn">Noche</button><button id="natBtn">Cámara HD</button><label style="align-self:center"><input type="checkbox" id="enh"> Retoque opcional</label>
 <input id="nin" type="file" accept="image/*" capture="environment" hidden><input id="vin" type="file" accept="video/*" capture="environment" hidden></div>
 <div id="bar"><img id="thumb" alt=""><button id="shot" aria-label="Disparador"></button><button id="flip">Girar cámara</button></div>
</div>
<div id="post" style="position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9;text-align:center"><div>Postproducción automática…<br>Equilibrio de color, luces y sombras, reducción de ruido y nitidez</div><div id="pp" style="font-size:28px">0%</div></div>
<div id="modal">
 <div id="cmp"><img id="prev" alt="Después"><img id="bf" alt="Antes"><input id="cs" type="range" min="0" max="100" value="50"></div><video id="pv" controls playsinline style="display:none"></video>
 <div id="ctl" class="row" style="display:none"><select id="sty"><option value="natural">Natural</option><option value="calido">Cálido</option><option value="cine">Cine</option></select>
 <label>Exp <input type="range" id="rExp" min="-1" max="1" step=".05" value="0"></label><label>Sombras <input type="range" id="rSh" min="-.2" max=".4" step=".02" value="0"></label><label>Temp <input type="range" id="rTp" min="-.1" max=".1" step=".01" value="0"></label>
 <label>HDR <input type="range" id="rHd" min="0" max="1" step=".05" value="0"></label><label>Ruido <input type="range" id="rNz" min="0" max="1" step=".05" value=".5"></label><label>Retrato <input type="range" id="rPt" min="0" max="1" step=".05" value="0"></label><button id="edg">Bordes</button>
 <select id="lim"><option value="0">Original</option><option value="1920">1080p</option></select><button id="rot">Girar</button><button id="rep">Informe</button></div>
 <div id="meta"></div><div id="toast"></div>
 <div class="row"><button id="discard">Cerrar</button><button id="dl">Descargar</button><button id="share" class="pri">Guardar en galería</button></div>
</div>
<script>
const $=id=>document.getElementById(id),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const VS='attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}';
// Revelado: reducción de ruido que respeta bordes -> nitidez solo en detalle real -> exposición en luz lineal
// con hombro suave (conserva luces como faroles) -> luz de sombras -> contraste -> color vivo sin saturar de más
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 uv;uniform sampler2D t;uniform vec2 px;uniform float rs,ex,dn,sh,ct,sl,sa;
float L(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
vec3 T(float x,float y,float s){return texture2D(t,uv+vec2(x,y)*px*s).rgb;}
void main(){
 vec3 c=T(0.,0.,1.);vec3 a=c;float ws=1.;float s2=3.*dn*dn+1e-5;
 for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++){
  if(i==0&&j==0)continue;
  vec3 q=T(float(i),float(j),1.);vec3 d=q-c;
  float w=exp(-dot(d,d)/s2)*((i==0||j==0)?1.:.7);a+=q*w;ws+=w;}
 vec3 o=a/ws;
 vec3 g=(T(-1.,0.,rs)+T(1.,0.,rs)+T(0.,-1.,rs)+T(0.,1.,rs))*.15+o*.4;
 float de=clamp(L(o)-L(g),-.1,.1);
 o+=de*sh*smoothstep(dn*.4,dn*1.5+.004,abs(de));
 o=pow(max(o,0.),vec3(2.2))*ex;
 float l=max(L(o),1e-4);float x=max(l-.6,0.);
 o*=(min(l,.6)+.4*(1.-exp(-x/.4)))/l;
 o=pow(clamp(o,0.,1.),vec3(1./2.2));
 o=pow(o,vec3(1.-sl*(1.-L(o))));
 o=mix(o,o*o*(3.-2.*o),ct);
 float v=L(o),m=max(o.r,max(o.g,o.b)),n=min(o.r,min(o.g,o.b));
 o=mix(vec3(v),o,1.+sa*(1.-(m>0.?(m-n)/m:0.)));
 gl_FragColor=vec4(clamp(o,0.,1.),1.);}`;

const PFS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 uv;uniform sampler2D t,h;uniform vec2 px;uniform vec3 wb;uniform float rs,ex,dn,sh,ct,sl,sa,lc,tw,hd,pm,eg;
float L(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
vec3 T(float x,float y,float s){return texture2D(t,uv+vec2(x,y)*px*s).rgb;}
float B(float r){float a=0.;for(int i=0;i<8;i++){float f=float(i)*.7854;a+=L(texture2D(t,uv+vec2(cos(f),sin(f))*r).rgb);}return a*.125;}
vec3 tone(vec3 o,float bs){
 o=pow(max(o,0.),vec3(2.2))*wb*ex;
 o*=pow(clamp(.2/(bs+.03),.6,2.4),lc);
 vec3 e0=min(o,1.),e1=min(o*3.,1.),e2=min(o*.35,1.);
 float w0=exp(-pow(L(e0)-.5,2.)/.08)+1e-3,w1=exp(-pow(L(e1)-.5,2.)/.08)+1e-3,w2=exp(-pow(L(e2)-.5,2.)/.08)+1e-3;
 o=mix(o,(e0*w0+e1*w1+e2*w2)/(w0+w1+w2),hd);
 float l=max(L(o),1e-4);float x=max(l-.6,0.);
 o*=(min(l,.6)+.4*(1.-exp(-x/.4)))/l;
 o=pow(clamp(o,0.,1.),vec3(1./2.2));
 o=pow(o,vec3(1.-sl*(1.-L(o))));
 o=mix(o,o*o*(3.-2.*o),ct);
 float v=L(o),m=max(o.r,max(o.g,o.b)),n=min(o.r,min(o.g,o.b));
 return clamp(mix(vec3(v),o,1.+sa*(1.-(m>0.?(m-n)/m:0.))),0.,1.);}
void main(){
 vec3 c=T(0.,0.,1.);vec3 a=c;float ws=1.;float s2=4.*dn*dn+1e-5;
 if(eg>.5){float gx=L(T(1.,-1.,rs))+2.*L(T(1.,0.,rs))+L(T(1.,1.,rs))-L(T(-1.,-1.,rs))-2.*L(T(-1.,0.,rs))-L(T(-1.,1.,rs));float gy=L(T(-1.,1.,rs))+2.*L(T(0.,1.,rs))+L(T(1.,1.,rs))-L(T(-1.,-1.,rs))-2.*L(T(0.,-1.,rs))-L(T(1.,-1.,rs));gl_FragColor=vec4(vec3(clamp(length(vec2(gx,gy))*2.5,0.,1.)),1.);return;}
 for(int i=-2;i<=2;i++)for(int j=-2;j<=2;j++){
  if(i==0&&j==0)continue;
  vec3 q=T(float(i),float(j),1.);vec3 d=q-c;
  float w=exp(-dot(d,d)/s2)/(1.+.35*float(i*i+j*j));a+=q*w;ws+=w;}
 vec3 o=a/ws;
 vec3 ca=c-L(c);for(int k=0;k<8;k++){float f=float(k)*.7854;vec3 q=texture2D(t,uv+vec2(cos(f),sin(f))*px*3.).rgb;ca+=q-L(q);}
 o=vec3(L(o))+ca/9.;
 vec3 g=(T(-1.,0.,rs)+T(1.,0.,rs)+T(0.,-1.,rs)+T(0.,1.,rs))*.15+o*.4;
 vec3 g2=(T(-1.,0.,3.*rs)+T(1.,0.,3.*rs)+T(0.,-1.,3.*rs)+T(0.,1.,3.*rs))*.15+o*.4;
 float de=clamp(L(o)-L(g),-.1,.1),d2=clamp(L(o)-L(g2),-.15,.15);
 o+=de*sh*smoothstep(dn*.4,dn*1.5+.004,abs(de))+d2*.5*lc;
 float bs=pow(max((B(.02)+B(.06))*.5,0.),2.2)*ex;
 vec3 res=tone(o,bs);
 if(pm>0.){float mk=smoothstep(.35,.65,texture2D(h,uv).r);vec3 bg=vec3(0.);
  for(int i=0;i<32;i++){float f=float(i)*2.39996;float r=sqrt((float(i)+.5)/32.)*pm;bg+=texture2D(t,uv+vec2(cos(f),sin(f))*r*px).rgb;}
  res=mix(tone(bg/32.,bs),res,mk);}
 o=res;
 if(tw>0.){vec3 pv=texture2D(h,uv).rgb;o=mix(o,pv,tw*(1.-smoothstep(.015,.06,length(o-pv))));}
 gl_FragColor=vec4(o,1.);}`;
class GP{ // procesador de imagen en GPU (WebGL), se reconstruye solo si el sistema pierde el contexto
 constructor(cv,fs=FS){this.cv=cv;this.fs=fs;cv.addEventListener('webglcontextlost',e=>{e.preventDefault();this.lost=true});
  cv.addEventListener('webglcontextrestored',()=>this.init());this.init()}
 init(){const g=this.g=this.cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});this.lost=false;
  const mk=(ty,s)=>{const o=g.createShader(ty);g.shaderSource(o,s);g.compileShader(o);return o};
  const pr=this.pr=g.createProgram();g.attachShader(pr,mk(g.VERTEX_SHADER,VS));g.attachShader(pr,mk(g.FRAGMENT_SHADER,this.fs));g.linkProgram(pr);g.useProgram(pr);
  g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
  const a=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);
  g.bindTexture(g.TEXTURE_2D,g.createTexture());
  [[g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE],[g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE],[g.TEXTURE_MIN_FILTER,g.LINEAR],[g.TEXTURE_MAG_FILTER,g.LINEAR]].forEach(([k,v])=>g.texParameteri(g.TEXTURE_2D,k,v));
  this.th=null;this.U={};for(const k of['px','rs','ex','dn','sh','ct','sl','sa','lc','tw','wb','h','hd','pm','eg'])this.U[k]=g.getUniformLocation(pr,k);
  this.max=g.getParameter(g.MAX_TEXTURE_SIZE)}
 draw(src,sw,sh,w,h,P){if(this.lost)return;const g=this.g,cv=this.cv;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  g.viewport(0,0,w,h);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,src);
  g.uniform2f(this.U.px,1/sw,1/sh);for(const k of['rs','ex','dn','sh','ct','sl','sa'])g.uniform1f(this.U[k],P[k]);
  g.uniform3f(this.U.wb,...(P.wb||[1,1,1]));g.uniform1f(this.U.lc,P.lc??.4);g.uniform1f(this.U.tw,P.tw||0);g.uniform1f(this.U.hd,P.hd||0);g.uniform1f(this.U.pm,P.pm||0);g.uniform1f(this.U.eg,P.eg||0);
  if(P.hist){g.activeTexture(g.TEXTURE1);if(!this.th){this.th=g.createTexture();g.bindTexture(g.TEXTURE_2D,this.th);
   [[g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE],[g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE],[g.TEXTURE_MIN_FILTER,g.LINEAR],[g.TEXTURE_MAG_FILTER,g.LINEAR]].forEach(([k,v])=>g.texParameteri(g.TEXTURE_2D,k,v))}else g.bindTexture(g.TEXTURE_2D,this.th);
   g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,P.hist);g.uniform1i(this.U.h,1);g.activeTexture(g.TEXTURE0)}
  g.drawArrays(g.TRIANGLE_STRIP,0,4)}
}

const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const view=$('view'),main=new GP(view),photo=new GP(document.createElement('canvas'),PFS);
const pr=document.createElement('canvas');pr.width=pr.height=64;const pc=pr.getContext('2d',{willReadFrequently:true});
let stream,track,ic,face='environment',n=0,mode='photo',starting=false,busy=false,cur=null,thumbUrl=null;
const A={ex:1,dn:.03,sh:.9,ct:.1,sl:.1,sa:.35}; // estado automático, se ajusta solo según la escena

function analyze(src){ // lee la escena (histograma) y decide exposición, ruido, nitidez, sombras y contraste
 pc.drawImage(src,0,0,64,64);const d=pc.getImageData(0,0,64,64).data,H=new Uint16Array(64);
 let R=0,G=0,Bc=0,N=0;for(let i=0;i<d.length;i+=4){const l=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];H[l>>2]++;
  const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(l>60&&l<200&&mx-mn<35){R+=d[i];G+=d[i+1];Bc+=d[i+2];N++}}
 const wb=N>200?[G/R,1,G/Bc].map(v=>1+(cl(v,.88,1.12)-1)*.6):[1,1,1];
 const q=p=>{let s=0;const t=p*4096;for(let i=0;i<64;i++){s+=H[i];if(s>=t)return(i+.5)/64}return 1};
 const p5=q(.05),p20=q(.2),p50=q(.5),p95=q(.95),lin=v=>Math.pow(v,2.2);
 let ex=cl(.13/lin(Math.max(p50,.02)),.85,4);
 ex=Math.min(ex,Math.max(1,2.6/lin(Math.max(p95,.05)))); // no quemar luces
 return{ex,dn:cl(.022+.03*(ex-1),.02,.12),sh:cl(1.1-.14*(ex-1),.35,1.1),sl:cl((.3-p20)*1.2,0,.4),ct:cl((.75-(p95-p5))*.7,0,.35),sa:.35,wb,lc:.45};
}
const ease=T=>{for(const k in A)A[k]+=(T[k]-A[k])*.12};

function loop(){requestAnimationFrame(loop);
 if(vid.readyState>=2&&vid.videoWidth&&!main.lost){
  try{if(n++%6===0)ease(analyze(vid))}catch(e){}
  const vw=vid.videoWidth,vh=vid.videoHeight,s=Math.min(1,2560/Math.max(vw,vh)),w=Math.round(vw*s),h=Math.round(vh*s);
  main.draw(vid,vw,vh,w,h,{...A,rs:Math.max(1,w/1280)});}}

async function start(){
 if(starting)return;starting=true;
 try{
  stream&&stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:face},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30}}});
  vid.srcObject=stream;await vid.play();track=stream.getVideoTracks()[0];
  track.onended=()=>{if(!starting)start()};
  ic=window.ImageCapture?new ImageCapture(track):null;
  track.applyConstraints({advanced:[{focusMode:'continuous'},{exposureMode:'continuous'},{whiteBalanceMode:'continuous'}]}).catch(()=>{});
  const s=track.getSettings();$('info').textContent=`Vista: ${s.width}×${s.height} · ${Math.round(s.frameRate||0)} fps · Automático`;
  $('msg').style.display='none';
 }catch(e){const m=$('msg');m.style.display='flex';
  m.textContent='No se pudo abrir la cámara ('+e.name+'). Concede el permiso y abre esta página desde HTTPS o localhost.';$('info').textContent='Sin cámara';}
 starting=false;
}
async function resume(){ // evita la pantalla negra al volver de compartir, bloquear o cambiar de app
 if(!stream||!track||track.readyState!=='live'||!stream.active)return start();
 try{if(vid.paused)await vid.play()}catch(e){start()}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resume()});
window.addEventListener('pageshow',resume);

function thumbFromView(){const c=document.createElement('canvas');c.width=104;c.height=104;const x=c.getContext('2d');
 const s=Math.max(104/view.width,104/view.height);x.drawImage(view,(104-view.width*s)/2,(104-view.height*s)/2,view.width*s,view.height*s);$('thumb').src=c.toDataURL('image/jpeg',.7)}

function openModal(){const v=cur.video;$('cmp').style.display=v?'none':'block';$('ctl').style.display=(!v&&cur.edit)?'flex':'none';$('cs').style.display=cur.before?'block':'none';$('bf').src=cur.before||cur.url;$('pv').style.display=v?'block':'none';
 if(v){$('pv').src=cur.url}else $('prev').src=cur.url;$('meta').textContent=cur.meta;$('toast').textContent='';$('modal').style.display='flex'}
function setCur(blob,type,ext,meta,before,edit){if(cur)URL.revokeObjectURL(cur.url);cur={blob,type,ext,meta,before,edit:!!edit,video:type.startsWith('video'),url:URL.createObjectURL(blob)};openModal()}

async function snap(){
 if(busy)return;busy=true;
 try{
  let bm=null;
  if(ic){try{const c=await ic.getPhotoCapabilities(),o={};
   if(c.imageWidth&&c.imageHeight){o.imageWidth=c.imageWidth.max;o.imageHeight=c.imageHeight.max}
   bm=await createImageBitmap(await ic.takePhoto(o));
   const big=Math.max(bm.width,bm.height);
   if(big>photo.max){const s=photo.max/big;bm=await createImageBitmap(bm,{resizeWidth:Math.floor(bm.width*s),resizeHeight:Math.floor(bm.height*s),resizeQuality:'high'})}
  }catch(e){bm=null}}
  const src=bm||vid,w=bm?bm.width:vid.videoWidth,h=bm?bm.height:vid.videoHeight,c=toCanvas(src,w,h);bm&&bm.close&&bm.close();thumbFromView();await showPhoto(c,false);
 }catch(e){alert('Error al tomar la foto: '+e.message)}
 busy=false;resume();
}

// ---- Grabación de video (se graba el video ya procesado + audio) ----
let mr,chunks=[],aud,t0,tmr;
async function recStart(){
 const cs=new MediaStream([track]);
 try{aud=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});cs.addTrack(aud.getAudioTracks()[0])}catch(e){aud=null}
 const mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
 const st=track.getSettings(),bps=cl((st.width||1280)*(st.height||720)*30*.1,8e6,40e6),res=`${st.width}×${st.height}`;
 mr=new MediaRecorder(cs,mime?{mimeType:mime,videoBitsPerSecond:bps}:{videoBitsPerSecond:bps});
 chunks=[];mr.ondataavailable=e=>{e.data&&e.data.size&&chunks.push(e.data)};
 mr.onstop=()=>{clearInterval(tmr);$('tm').style.display='none';$('shot').classList.remove('rec');
  aud&&aud.getTracks().forEach(t=>t.stop());
  const type=(mr.mimeType||mime||'video/webm').split(';')[0],blob=new Blob(chunks,{type});
  deliver(blob,type,type.includes('mp4')?'mp4':'webm',res,(Date.now()-t0)/1000);resume()};
 thumbFromView();mr.start(1000);t0=Date.now();
 $('shot').classList.add('rec');$('tm').style.display='block';
 tmr=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('tm').textContent='● '+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
}
const recStop=()=>mr&&mr.state!=='inactive'&&mr.stop();
const recording=()=>mr&&mr.state==='recording';

// ---- Postproducción de video: se re-renderiza con el revelado profesional + reducción de ruido temporal ----
async function postVideo(blob,dur){
 const v=document.createElement('video');v.playsInline=true;v.src=URL.createObjectURL(blob);
 await new Promise((ok,no)=>{v.onloadeddata=ok;v.onerror=()=>no(new Error('video'))});

 let P=null,k=0,run=true;const fin=()=>{run=false;m2.state!=='inactive'&&m2.stop()};v.onended=fin;

async function deliver(blob,type,ext,res,dur){
 const mb=b=>(b.size/1048576).toFixed(1)+' MB',d=dur?Math.round(dur)+' s · ':'';

 $('post').style.display='flex';$('pp').textContent='0%';
 try{const r=await postVideo(blob,dur);setCur(r.blob,r.type,r.ext,`${r.res} · ${d}${mb(r.blob)} · postproducido`)}
 catch(e){setCur(blob,type,ext,`${res} · ${d}${mb(blob)} · original (la postproducción no estuvo disponible)`)}

// ---- Edición de foto: revelado automático + ajustes manuales + estilos + comparador + informe ----
const ST={natural:{ct:0,sa:0,t:0},calido:{ct:.05,sa:.1,t:.06},cine:{ct:.18,sa:-.12,t:-.04}};
const ed={src:null,nat:false,exp:0,sh:0,tp:0,style:'natural',lim:0,before:null,hd:0,nz:.5,pt:0,eg:false,mask:null};
function toCanvas(src,w,h){const c=document.createElement('canvas'),k=Math.min(1,4096/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
async function develop(edge){
 const c=ed.src,T=analyze(c),S=ST[ed.style];if(ed.nat){T.ex=cl(T.ex,.9,1.3);T.dn=Math.min(T.dn,.04);T.sh=Math.min(T.sh,.5);T.lc=.25}
 const k=ed.lim?Math.min(1,ed.lim/Math.max(c.width,c.height)):1,W=Math.round(c.width*k),H=Math.round(c.height*k),tp=ed.tp+S.t;
 photo.draw(c,c.width,c.height,W,H,{...T,dn:T.dn*(.4+ed.nz*1.2),hd:ed.hd,pm:ed.mask?ed.pt*.02*c.width:0,eg:edge?1:0,hist:ed.mask&&ed.pt>0?ed.mask:null,ex:T.ex*Math.pow(2,ed.exp),sl:cl(T.sl+ed.sh,0,.6),ct:cl(T.ct+S.ct,0,.5),sa:T.sa+S.sa,wb:[T.wb[0]*(1+tp),T.wb[1],T.wb[2]*(1-tp)],rs:Math.max(1,c.width/1280)});
 const blob=await new Promise(r=>photo.cv.toBlob(r,'image/jpeg',.95));photo.cv.width=photo.cv.height=1;if(!blob)throw new Error('No se pudo procesar');
 return{blob,meta:`${W}×${H} px · ${(blob.size/1048576).toFixed(1)} MB · ${ed.style}`}}
async function showPhoto(c,nat){
 Object.assign(ed,{src:c,nat,exp:0,sh:0,tp:0,style:'natural',lim:0,hd:0,nz:.5,pt:0,eg:false,mask:null});['rExp','rSh','rTp','rHd','rPt'].forEach(i=>$(i).value=0);$('rNz').value=.5;$('edg').classList.remove('pri');$('sty').value='natural';$('lim').value='0';
 ed.before&&URL.revokeObjectURL(ed.before);ed.before=URL.createObjectURL(await new Promise(r=>c.toBlob(r,'image/jpeg',.9)));
 const r=await develop();setCur(r.blob,'image/jpeg','jpg',r.meta,ed.before,true);$('thumb').src=cur.url}
let rt;const redo=()=>{clearTimeout(rt);rt=setTimeout(async()=>{try{const r=await develop(ed.eg);
  if(ed.eg){$('prev').src=URL.createObjectURL(r.blob);$('bf').style.display='none'}else{$('bf').style.display='';setCur(r.blob,'image/jpeg','jpg',r.meta,ed.before,true)}}catch(e){}},150)};
['sty','rExp','rSh','rTp','rHd','rNz','rPt','lim'].forEach(i=>$(i).oninput=async()=>{ed.style=$('sty').value;ed.exp=+$('rExp').value;ed.sh=+$('rSh').value;ed.tp=+$('rTp').value;ed.hd=+$('rHd').value;ed.nz=+$('rNz').value;ed.pt=+$('rPt').value;ed.lim=+$('lim').value;
 if(ed.pt>0&&!ed.mask){$('toast').textContent='Detectando al sujeto (IA)…';if(!await ensureMask()){$('toast').textContent='No se pudo cargar la IA de retrato (requiere internet)';$('rPt').value=0;ed.pt=0}else $('toast').textContent=''}
 redo()});
$('edg').onclick=()=>{ed.eg=!ed.eg;$('edg').classList.toggle('pri',ed.eg);redo()};
// Retrato: segmentación de persona con MediaPipe (IA en el navegador); el fondo se desenfoca en el shader
async function ensureMask(){
 if(ed.mask)return true;
 try{const U='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/';
  if(!window.SelfieSegmentation)await new Promise((ok,no)=>{const e=document.createElement('script');e.src=U+'selfie_segmentation.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)});
  const sg=window._sg||(window._sg=new SelfieSegmentation({locateFile:f=>U+f}));sg.setOptions({modelSelection:0});
  const k=768/Math.max(ed.src.width,ed.src.height),c=document.createElement('canvas');c.width=Math.round(ed.src.width*k);c.height=Math.round(ed.src.height*k);c.getContext('2d').drawImage(ed.src,0,0,c.width,c.height);
  const m=await new Promise((ok,no)=>{sg.onResults(r=>{const o=document.createElement('canvas');o.width=r.segmentationMask.width;o.height=r.segmentationMask.height;const x=o.getContext('2d',{willReadFrequently:true});x.drawImage(r.segmentationMask,0,0);
   const im=x.getImageData(0,0,o.width,o.height),d=im.data;let mn=255;for(let i=3;i<d.length;i+=4)mn=Math.min(mn,d[i]);
   for(let i=0;i<d.length;i+=4){const v=mn<250?d[i+3]:d[i];d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255}x.putImageData(im,0,0);ok(o)});sg.send({image:c}).catch(no)});
  ed.mask=m;return true}catch(e){return false}}
$('cs').oninput=e=>{$('bf').style.clipPath=`inset(0 ${100-e.target.value}% 0 0)`};
function qm(src){const sw=src.width||src.naturalWidth,sh=src.height||src.naturalHeight,k=512/Math.max(sw,sh),w=Math.round(sw*k),h=Math.round(sh*k),c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);const d=x.getImageData(0,0,w,h).data,Y=new Float32Array(w*h);let m=0,v=0;
 for(let i=0;i<w*h;i++){Y[i]=.2126*d[i*4]+.7152*d[i*4+1]+.0722*d[i*4+2];m+=Y[i]}const ls=[];

$('rep').onclick=async()=>{const a=qm(ed.src),b=qm(await createImageBitmap(cur.blob));
 $('toast').textContent=`Antes→Después · Brillo ${a.br}%→${b.br}% · Nitidez ${a.sh}→${b.sh} · Ruido est. ${a.nz}→${b.nz}`};
$('rot').onclick=async()=>{const c=ed.src,r=document.createElement('canvas');r.width=c.height;r.height=c.width;const x=r.getContext('2d');x.translate(r.width,0);x.rotate(Math.PI/2);x.drawImage(c,0,0);

// ---- Modo noche: apila 8 cuadros alineados (promedio) para bajar el ruido ----
async function night(){
 if(busy||!vid.videoWidth)return;busy=true;$('post').style.display='flex';$('pp').textContent='0%';
 try{const N=8,k=Math.min(1,1920/Math.max(vid.videoWidth,vid.videoHeight)),w=Math.round(vid.videoWidth*k),h=Math.round(vid.videoHeight*k),gw=96,gh=Math.round(96*h/w);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true}),g=document.createElement('canvas');g.width=gw;g.height=gh;const gx=g.getContext('2d',{willReadFrequently:true});
  const acc=new Float32Array(w*h*3);let ref=null;
  for(let n=0;n<N;n++){x.drawImage(vid,0,0,w,h);gx.drawImage(c,0,0,gw,gh);const gd=gx.getImageData(0,0,gw,gh).data,Y=new Float32Array(gw*gh);for(let i=0;i<Y.length;i++)Y[i]=gd[i*4+1];
   let dx=0,dy=0;if(!ref)ref=Y;else{let best=1e18;for(let a=-4;a<=4;a++)for(let b=-4;b<=4;b++){let e=0;for(let y=6;y<gh-6;y+=2)for(let q=6;q<gw-6;q+=2)e+=Math.abs(ref[y*gw+q]-Y[(y+b)*gw+q+a]);if(e<best){best=e;dx=a;dy=b}}}
   const sx=Math.round(dx*w/gw),sy=Math.round(dy*w/gw),d=x.getImageData(0,0,w,h).data;
   for(let y=0;y<h;y++){const yy=cl(y+sy,0,h-1);for(let q=0;q<w;q++){const o=(y*w+q)*3,p=(yy*w+cl(q+sx,0,w-1))*4;acc[o]+=d[p];acc[o+1]+=d[p+1];acc[o+2]+=d[p+2]}}
   $('pp').textContent=Math.round((n+1)/N*100)+'%';await new Promise(r=>setTimeout(r,100))}
  const im=x.createImageData(w,h);for(let i=0,o=0;i<acc.length;i+=3,o+=4){im.data[o]=acc[i]/N;im.data[o+1]=acc[i+1]/N;im.data[o+2]=acc[i+2]/N;im.data[o+3]=255}
  x.putImageData(im,0,0);thumbFromView();await showPhoto(c,false);
 }catch(e){alert('Modo noche: '+e.message)}
 $('post').style.display='none';busy=false;resume()}
$('nightBtn').onclick=night;

// ---- Guardado ----
const mkFile=()=>new File([cur.blob],'UltraCam_'+Date.now()+'.'+cur.ext,{type:cur.type});
function download(){const f=mkFile(),a=document.createElement('a');a.href=cur.url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
 $('toast').textContent='Guardado en Descargas del dispositivo'}
async function share(){const f=mkFile();
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});$('toast').textContent='Elige "Guardar imagen/video" para enviarlo a la galería'}else download()}
 catch(e){if(e.name!=='AbortError')alert('No se pudo compartir: '+e.message)}
 resume()}

function setMode(m){if(recording())return;mode=m;$('mPhoto').classList.toggle('on',m==='photo');$('mVideo').classList.toggle('on',m==='video');$('shot').classList.toggle('vid',m==='video')}
$('mPhoto').onclick=()=>setMode('photo');$('mVideo').onclick=()=>setMode('video');
$('shot').onclick=()=>{if(mode==='photo'){ic?snap():$('nin').click()}else if(!ic&&!recording()){$('vin').click()}else{recording()?recStop():recStart()}};
$('flip').onclick=()=>{if(recording())return;face=face==='environment'?'user':'environment';start()};
$('discard').onclick=()=>{$('pv').pause();$('modal').style.display='none';resume()};
$('dl').onclick=download;$('share').onclick=share;
$('thumb').onclick=()=>{cur&&openModal()};
// Cámara nativa (iPhone/Safari): foto y video con la calidad completa de la app Cámara, luego mejora opcional
$('natBtn').onclick=()=>$(mode==='video'?'vin':'nin').click();
$('nin').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  if(!$('enh').checked){setCur(f,f.type||'image/jpeg','jpg',`${(f.size/1048576).toFixed(1)} MB · original`)}
  else{
   const im=new Image(),u=URL.createObjectURL(f);im.src=u;await im.decode();await showPhoto(toCanvas(im,im.naturalWidth,im.naturalHeight),true);URL.revokeObjectURL(u)}
  $('thumb').src=cur.url;
 }catch(err){alert('Error: '+err.message)}
 resume()};
$('vin').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 deliver(f,f.type||'video/quicktime',(f.name.split('.').pop()||'mov').toLowerCase(),'cámara',0);resume()};
if(!window.ImageCapture)$('nightBtn').style.display='none'; // en iPhone el video en vivo da peor calidad: se usa la cámara nativa
start();loop();
